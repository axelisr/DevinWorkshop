piggymetrics:
  security:
    user-info-uri: http://auth-service:5000/uaa/users/current

resilience4j:
  timelimiter:
    configs:
      default:
        timeout-duration: 20s

spring:
  data:
    mongodb:
      host: statistics-mongodb
      username: user
      password: ${MONGODB_PASSWORD}
      database: piggymetrics
      port: 27017

server:
  servlet:
    context-path: /statistics
  port: 7000

rates:
  url: https://api.exchangeratesapi.io
