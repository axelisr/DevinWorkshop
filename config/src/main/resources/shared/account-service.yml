spring:
  data:
    mongodb:
      host: account-mongodb
      username: user
      password: ${MONGODB_PASSWORD}
      database: piggymetrics
      port: 27017
  security:
    oauth2:
      client:
        registration:
          account-service:
            client-id: account-service
            client-secret: ${ACCOUNT_SERVICE_PASSWORD}
            authorization-grant-type: client_credentials
            scope: server
            provider: auth-service
        provider:
          auth-service:
            token-uri: http://auth-service:5000/uaa/oauth/token
      resourceserver:
        opaquetoken:
          # legacy auth-service user-info endpoint, resolved by LegacyUserInfoOpaqueTokenIntrospector
          introspection-uri: http://auth-service:5000/uaa/users/current
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

resilience4j:
  timelimiter:
    configs:
      default:
        timeout-duration: 10s

management:
  tracing:
    sampling:
      probability: 0.1

server:
  servlet:
    context-path: /accounts
  port: 6000
